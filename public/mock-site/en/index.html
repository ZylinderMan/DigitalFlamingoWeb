<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Website</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #111111;
  }
  nav {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #eee;
  }
  .logo { font-weight: 700; font-size: 1rem; }
  .nav-toggle { display: none; }
  .nav-toggle-label { display: none; cursor: pointer; font-size: 1.3rem; }
  .nav-links {
    display: flex;
    gap: 20px;
    list-style: none;
    font-size: 0.85rem;
    color: #333;
  }
  .hero { padding: 56px 24px; text-align: center; }
  .hero h1 { font-size: 2.2rem; margin-bottom: 10px; }
  .hero p { color: #555; margin-bottom: 20px; font-size: 0.95rem; }
  .cta {
    display: inline-block;
    padding: 10px 22px;
    background: #111;
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.85rem;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 32px 24px 48px;
  }
  .feature {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 18px 12px;
    text-align: center;
  }
  .feature .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #111;
    margin: 0 auto 10px;
  }
  .feature p { font-size: 0.8rem; color: #333; }
  footer {
    padding: 20px 24px;
    text-align: center;
    color: #999;
    font-size: 0.75rem;
    border-top: 1px solid #eee;
  }

  @media (max-width: 480px) {
    .nav-toggle-label { display: block; }
    .nav-links {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      flex-direction: column;
      background: #fff;
      padding: 16px 24px;
      display: none;
      border-bottom: 1px solid #eee;
    }
    .nav-toggle:checked ~ .nav-links { display: flex; }
    .features { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<nav>
  <span class="logo">Your Website</span>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" />
  <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
  <ul class="nav-links">
    <li>Home</li>
    <li>About</li>
    <li>Contact</li>
  </ul>
</nav>

<section class="hero">
  <h1>Your Website</h1>
  <p>This could be exactly what your customers see.</p>
  <a class="cta" href="#">Get Started</a>
</section>

<section class="features">
  <div class="feature"><div class="dot"></div><p>Fast</p></div>
  <div class="feature"><div class="dot"></div><p>Modern</p></div>
  <div class="feature"><div class="dot"></div><p>Yours</p></div>
</section>

<footer>&copy; Your Business Name</footer>

</body>
</html>
